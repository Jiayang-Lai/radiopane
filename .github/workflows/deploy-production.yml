name: Deploy Production

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-main-tag:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.verify.outputs.should_deploy }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tagged commit is on main
        id: verify
        run: |
          git fetch origin main --depth=1

          if git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/main'; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Tag $GITHUB_REF_NAME does not point to a commit on origin/main."
          fi

  deploy-production:
    needs: verify-main-tag
    if: needs.verify-main-tag.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy production to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy .svelte-kit/cloudflare --project-name=radiopane --branch=production